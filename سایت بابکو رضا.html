<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 بابک و رضوو</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  background: #0a0a1a;
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 140px;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(233,69,96,0.2), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(243,156,18,0.15), transparent 40%);
  z-index: -1;
  animation: bgMove 15s ease-in-out infinite alternate;
}
@keyframes bgMove {
  0% { transform: scale(1); }
  100% { transform: scale(1.2); }
}

/* قلب‌های شناور */
.hearts-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}
.heart {
  position: absolute;
  bottom: -50px;
  font-size: 20px;
  color: #e94560;
  opacity: 0.6;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  10% { opacity: 0.7; }
  90% { opacity: 0.7; }
  100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}

/* هدر */
header {
  position: relative;
  padding: 50px 20px 30px;
  text-align: center;
  background: linear-gradient(180deg, rgba(0,0,0,0.5), transparent);
  backdrop-filter: blur(10px);
}
header::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #e94560, #f39c12, #e94560, transparent);
}
.logo {
  font-size: 3rem;
  font-weight: 900;
  background: linear-gradient(90deg, #e94560, #f39c12, #e94560);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 3s linear infinite;
  margin-bottom: 12px;
}
@keyframes shine {
  to { background-position: 200% center; }
}
.subtitle { color: #aaa; font-size: 1.05rem; }

/* شمارنده */
.counter {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 25px auto 10px;
  flex-wrap: wrap;
}
.counter-item {
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(233,69,96,0.4);
  border-radius: 15px;
  padding: 12px 20px;
  min-width: 80px;
  backdrop-filter: blur(10px);
}
.counter-num {
  display: block;
  font-size: 1.8rem;
  font-weight: 900;
  background: linear-gradient(135deg, #e94560, #f39c12);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.counter-label { font-size: 0.85rem; color: #aaa; }
.counter-text { color: #e94560; font-size: 0.95rem; margin-top: 5px; }

/* جستجو */
.search-container {
  max-width: 600px;
  margin: 30px auto 0;
  position: relative;
  padding: 0 20px;
}
.search-box {
  width: 100%;
  padding: 15px 55px 15px 20px;
  background: rgba(255,255,255,0.06);
  border: 2px solid rgba(233,69,96,0.3);
  border-radius: 50px;
  color: #fff;
  font-size: 1rem;
  font-family: inherit;
  outline: none;
  transition: all 0.3s;
}
.search-box:focus {
  border-color: #e94560;
  background: rgba(233,69,96,0.1);
  box-shadow: 0 0 25px rgba(233,69,96,0.3);
}
.search-icon {
  position: absolute;
  right: 40px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.2rem;
}

/* تب‌ها */
.tabs {
  display: flex;
  justify-content: center;
  gap: 15px;
  padding: 30px 20px 10px;
  flex-wrap: wrap;
}
.tab-btn {
  padding: 12px 30px;
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.1);
  color: #ccc;
  border-radius: 50px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  transition: all 0.3s;
}
.tab-btn:hover {
  background: rgba(233,69,96,0.2);
  border-color: #e94560;
  color: #fff;
  transform: translateY(-2px);
}
.tab-btn.active {
  background: linear-gradient(135deg, #e94560, #f39c12);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 8px 25px rgba(233,69,96,0.4);
}

/* بخش‌ها */
.section {
  max-width: 1300px;
  margin: 40px auto;
  padding: 0 25px;
  animation: fadeIn 0.5s ease;
}
.section.hidden { display: none; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.section-title {
  font-size: 1.8rem;
  margin-bottom: 30px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-title::before {
  content: '';
  width: 5px;
  height: 30px;
  background: linear-gradient(180deg, #e94560, #f39c12);
  border-radius: 5px;
}

/* گالری */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
}
.gallery-item {
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  aspect-ratio: 1;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition: all 0.4s;
  border: 2px solid transparent;
}
.gallery-item:hover {
  transform: translateY(-8px) scale(1.02);
  border-color: #e94560;
  box-shadow: 0 20px 40px rgba(233,69,96,0.4);
}
.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s;
}
.gallery-item:hover img { transform: scale(1.15); }
.gallery-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(transparent 40%, rgba(10,10,26,0.95));
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 20px;
  opacity: 0;
  transition: opacity 0.4s;
}
.gallery-item:hover .gallery-overlay { opacity: 1; }
.gallery-overlay h4 { font-size: 1.1rem; margin-bottom: 5px; }
.gallery-overlay p { font-size: 0.85rem; color: #aaa; }

/* آهنگ‌ها */
.songs-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 18px;
}
.song-card {
  background: rgba(255,255,255,0.04);
  border: 1.5px solid rgba(255,255,255,0.08);
  border-radius: 18px;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: all 0.35s;
}
.song-card:hover {
  border-color: #e94560;
  transform: translateX(-8px);
  box-shadow: 0 15px 35px rgba(233,69,96,0.25);
}
.song-card.active {
  border-color: #f39c12;
  background: rgba(243,156,18,0.1);
  box-shadow: 0 10px 30px rgba(243,156,18,0.3);
}
.song-cover {
  width: 65px;
  height: 65px;
  border-radius: 12px;
  background: linear-gradient(135deg, #e94560, #f39c12);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  flex-shrink: 0;
  box-shadow: 0 5px 15px rgba(233,69,96,0.4);
}
.song-info { flex: 1; min-width: 0; }
.song-info h3 {
  font-size: 1.05rem;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.song-info p { font-size: 0.85rem; color: #999; }

/* یادداشت‌ها */
.notes-container { display: grid; gap: 25px; }
.note-form {
  background: rgba(255,255,255,0.04);
  border: 2px solid rgba(233,69,96,0.3);
  border-radius: 20px;
  padding: 25px;
}
.note-input, .note-textarea {
  width: 100%;
  padding: 15px;
  background: rgba(0,0,0,0.3);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  color: #fff;
  font-family: inherit;
  font-size: 1rem;
  outline: none;
  margin-bottom: 15px;
  transition: all 0.3s;
}
.note-input:focus, .note-textarea:focus {
  border-color: #e94560;
  background: rgba(233,69,96,0.1);
}
.note-textarea { min-height: 120px; resize: vertical; }
.note-btn {
  padding: 12px 35px;
  background: linear-gradient(135deg, #e94560, #f39c12);
  border: none;
  border-radius: 50px;
  color: #fff;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 8px 25px rgba(233,69,96,0.4);
}
.note-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(233,69,96,0.6); }
.notes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}
.note-card {
  background: linear-gradient(135deg, rgba(233,69,96,0.15), rgba(243,156,18,0.1));
  border: 2px solid rgba(233,69,96,0.3);
  border-radius: 18px;
  padding: 20px;
  position: relative;
  transition: all 0.3s;
}
.note-card:hover { transform: translateY(-5px); border-color: #e94560; }
.note-card h4 {
  font-size: 1.15rem;
  margin-bottom: 10px;
  color: #f39c12;
}
.note-card p { font-size: 0.95rem; line-height: 1.7; color: #ddd; margin-bottom: 10px; }
.note-card .note-date { font-size: 0.8rem; color: #888; }
.note-card .delete-note {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(233,69,96,0.3);
  border: none;
  color: #fff;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.3s;
}
.note-card .delete-note:hover { background: #e94560; }

/* پلیر */
.player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(15,15,30,0.98);
  backdrop-filter: blur(20px);
  border-top: 2px solid #e94560;
  padding: 15px 25px;
  display: grid;
  grid-template-columns: 1fr 1.5fr 1fr;
  gap: 20px;
  align-items: center;
  z-index: 100;
  box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
}
.player-info { display: flex; align-items: center; gap: 15px; min-width: 0; }
.player-cover {
  width: 55px;
  height: 55px;
  border-radius: 12px;
  background: linear-gradient(135deg, #e94560, #f39c12);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  flex-shrink: 0;
  box-shadow: 0 5px 15px rgba(233,69,96,0.4);
}
.player-details { min-width: 0; }
.player-title { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-artist { font-size: 0.8rem; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.75rem;
  color: #aaa;
}
.player-progress input[type="range"] {
  flex: 1;
  accent-color: #e94560;
  cursor: pointer;
}
.player-controls {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center;
}
.ctrl-btn {
  background: rgba(255,255,255,0.08);
  border: none;
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.3s;
}
.ctrl-btn:hover { background: rgba(233,69,96,0.4); transform: scale(1.1); }
.ctrl-btn.active { background: #e94560; }
.main-btn {
  width: 50px;
  height: 50px;
  background: linear-gradient(135deg, #e94560, #f39c12);
  font-size: 1.2rem;
  box-shadow: 0 5px 20px rgba(233,69,96,0.5);
}
.main-btn:hover { transform: scale(1.15); }
.volume-control {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.9rem;
  justify-content: flex-end;
}
.volume-control input[type="range"] {
  width: 100px;
  accent-color: #e94560;
  cursor: pointer;
}

/* لایت‌باکس */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 200;
  justify-content: center;
  align-items: center;
  padding: 30px;
}
.lightbox.active { display: flex; animation: fadeIn 0.3s; }
.lightbox img {
  max-width: 90%;
  max-height: 85vh;
  border-radius: 15px;
  box-shadow: 0 20px 60px rgba(233,69,96,0.5);
}
.lightbox-close {
  position: absolute;
  top: 25px;
  left: 25px;
  color: #fff;
  font-size: 2rem;
  cursor: pointer;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(233,69,96,0.3);
  transition: all 0.3s;
}
.lightbox-close:hover { background: #e94560; }
.lightbox-prev, .lightbox-next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: #fff;
  font-size: 2.5rem;
  cursor: pointer;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(233,69,96,0.3);
  transition: all 0.3s;
  user-select: none;
}
.lightbox-prev { right: 25px; }
.lightbox-next { left: 25px; }
.lightbox-prev:hover, .lightbox-next:hover { background: #e94560; }
.lightbox-caption {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  font-size: 1.1rem;
  background: rgba(233,69,96,0.4);
  padding: 10px 25px;
  border-radius: 30px;
  backdrop-filter: blur(10px);
}

footer {
  text-align: center;
  padding: 40px 20px;
  color: #666;
  font-size: 0.9rem;
  border-top: 1px solid rgba(255,255,255,0.05);
  margin-top: 50px;
}

@media (max-width: 768px) {
  .logo { font-size: 2rem; }
  .player {
    grid-template-columns: 1fr;
    padding: 12px 15px;
    gap: 10px;
  }
  .player-progress { order: 3; }
  .volume-control { display: none; }
  .counter-item { padding: 8px 14px; min-width: 65px; }
  .counter-num { font-size: 1.3rem; }
  .lightbox-prev, .lightbox-next { width: 40px; height: 40px; font-size: 1.8rem; }
}
</style>
</head>
<body>

<div class="hearts-container" id="hearts"></div>

<header>
  <h1 class="logo">💕 بابک و رضوو 💕</h1>
  <p class="subtitle">دنیای کوچک ما دو نفر</p>
  
  <div class="counter">
    <div class="counter-item">
      <span class="counter-num" id="daysCount">0</span>
      <span class="counter-label">روز</span>
    </div>
    <div class="counter-item">
      <span class="counter-num" id="hoursCount">0</span>
      <span class="counter-label">ساعت</span>
    </div>
    <div class="counter-item">
      <span class="counter-num" id="minutesCount">0</span>
      <span class="counter-label">دقیقه</span>
    </div>
    <div class="counter-item">
      <span class="counter-num" id="secondsCount">0</span>
      <span class="counter-label">ثانیه</span>
    </div>
  </div>
  <p class="counter-text">با هم بودن 💗</p>
</header>

<div class="search-container">
  <input type="text" class="search-box" id="searchBox" placeholder="جستجو در عکس‌ها و آهنگ‌ها...">
  <span class="search-icon">🔍</span>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="gallery">📸 گالری عکس</button>
  <button class="tab-btn" data-tab="songs">🎵 آهنگ‌ها</button>
  <button class="tab-btn" data-tab="notes">💌 یادداشت‌ها</button>
</div>

<section class="section" id="gallery-section">
  <h2 class="section-title">📸 خاطرات تصویری</h2>
  <div class="gallery" id="gallery"></div>
</section>

<section class="section hidden" id="songs-section">
  <h2 class="section-title">🎵 آهنگ‌های خاص ما</h2>
  <div class="songs-list" id="songsList"></div>
</section>

<section class="section hidden" id="notes-section">
  <h2 class="section-title">💌 یادداشت‌های عاشقانه</h2>
  <div class="notes-container">
    <div class="note-form">
      <input type="text" id="noteTitle" placeholder="عنوان یادداشت..." class="note-input">
      <textarea id="noteText" placeholder="متن یادداشت عاشقانه‌ات رو بنویس..." class="note-textarea"></textarea>
      <button class="note-btn" onclick="addNote()">✨ ثبت یادداشت</button>
    </div>
    <div class="notes-grid" id="notesGrid"></div>
  </div>
</section>

<div class="player">
  <div class="player-info">
    <div class="player-cover" id="playerCover">🎵</div>
    <div class="player-details">
      <div class="player-title" id="playerTitle">آهنگی انتخاب نشده</div>
      <div class="player-artist" id="playerArtist">یک آهنگ رو انتخاب کن</div>
    </div>
  </div>
  
  <div class="player-progress">
    <span id="currentTime">0:00</span>
    <input type="range" id="progressBar" value="0" min="0" max="100">
    <span id="totalTime">0:00</span>
  </div>
  
  <div class="player-controls">
    <button class="ctrl-btn" onclick="toggleShuffle()" id="shuffleBtn">🔀</button>
    <button class="ctrl-btn" onclick="prevSong()">⏮</button>
    <button class="ctrl-btn main-btn" onclick="togglePlay()" id="playBtn">▶</button>
    <button class="ctrl-btn" onclick="nextSong()">⏭</button>
    <button class="ctrl-btn" onclick="toggleRepeat()" id="repeatBtn">🔁</button>
  </div>
  
  <div class="volume-control">
    <span>🔊</span>
    <input type="range" id="volumeBar" min="0" max="100" value="70">
  </div>
</div>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">✕</span>
  <span class="lightbox-prev" onclick="prevImage()">❮</span>
  <img id="lightboxImg" src="" alt="">
  <span class="lightbox-next" onclick="nextImage()">❯</span>
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<footer>
  <p>ساخته شده با ❤️ برای بابک و رضوو</p>
</footer>

<audio id="audioPlayer"></audio>

<script>
/* ============ داده‌ها (اینجا عکس و آهنگ‌هات رو بذار) ============ */
const galleryData = [
  { src: 'https://picsum.photos/500/500?random=1', title: 'اولین خاطره', desc: 'روزی که همه چیز شروع شد' },
  { src: 'https://picsum.photos/500/500?random=2', title: 'یه روز خاص', desc: 'خنده‌های بی‌پایان' },
  { src: 'https://picsum.photos/500/500?random=3', title: 'سفر به یادماندنی', desc: 'ماجراجویی ما' },
  { src: 'https://picsum.photos/500/500?random=4', title: 'غروب زیبا', desc: 'لحظه‌های آرام' },
  { src: 'https://picsum.photos/500/500?random=5', title: 'خنده‌های شیرین', desc: 'همیشه بخند' },
  { src: 'https://picsum.photos/500/500?random=6', title: 'لحظه دلخواه', desc: 'کنار هم' },
  { src: 'https://picsum.photos/500/500?random=7', title: 'شب‌های روشن', desc: 'زیر آسمان' },
  { src: 'https://picsum.photos/500/500?random=8', title: 'روز بارانی', desc: 'کنار هم زیر باران' }
];

const songsData = [
  { title: 'آهنگ اول', artist: 'خواننده مورد علاقه', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', cover: '🎵' },
  { title: 'آهنگ دوم', artist: 'خواننده مورد علاقه', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', cover: '🎶' },
  { title: 'آهنگ سوم', artist: 'خواننده مورد علاقه', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3', cover: '🎼' },
  { title: 'آهنگ چهارم', artist: 'خواننده مورد علاقه', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3', cover: '🎤' },
  { title: 'آهنگ پنجم', artist: 'خواننده مورد علاقه', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3', cover: '🎧' },

// تاریخ شروع رابطه (اینجا تغییر بده)
const startDate = new Date('2023-01-01T00:00:00');

/* ============ متغیرهای پلیر ============ */
let currentIndex = 0;
let isShuffle = false;
let isRepeat = false;
let currentImageIndex = 0;
let filteredGallery = [...galleryData];

const audio = document.getElementById('audioPlayer');
const playBtn = document.getElementById('playBtn');
const progressBar = document.getElementById('progressBar');
const volumeBar = document.getElementById('volumeBar');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');

/* ============ ساخت گالری ============ */
function renderGallery(data = galleryData) {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  filteredGallery = [...data];
  
  if (data.length === 0) {
    gallery.innerHTML = '<p style="text-align:center;color:#888;padding:40px;">عکسی پیدا نشد 🔍</p>';
    return;
  }
  
  data.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.innerHTML = `
      <img src="${item.src}" alt="${item.title}" loading="lazy">
      <div class="gallery-overlay">
        <h4>${item.title}</h4>
        <p>${item.desc}</p>
      </div>
    `;
    div.onclick = () => openLightbox(index);
    gallery.appendChild(div);
  });
}

/* ============ لایت‌باکس ============ */
function openLightbox(index) {
  currentImageIndex = index;
  const lightbox = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  const caption = document.getElementById('lightboxCaption');
  
  img.src = filteredGallery[index].src;
  caption.textContent = filteredGallery[index].title;
  lightbox.classList.add('active');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
}

function nextImage() {
  currentImageIndex = (currentImageIndex + 1) % filteredGallery.length;
  openLightbox(currentImageIndex);
}

function prevImage() {
  currentImageIndex = (currentImageIndex - 1 + filteredGallery.length) % filteredGallery.length;
  openLightbox(currentImageIndex);
}

document.addEventListener('keydown', (e) => {
  const lb = document.getElementById('lightbox');
  if (!lb.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') nextImage();
  if (e.key === 'ArrowRight') prevImage();
});

/* ============ ساخت لیست آهنگ‌ها ============ */
function renderSongs(data = songsData) {
  const list = document.getElementById('songsList');
  list.innerHTML = '';
  
  if (data.length === 0) {
    list.innerHTML = '<p style="text-align:center;color:#888;padding:40px;">آهنگی پیدا نشد 🔍</p>';
    return;
  }
  
  data.forEach((song) => {
    const realIndex = songsData.indexOf(song);
    const card = document.createElement('div');
    card.className = 'song-card' + (realIndex === currentIndex ? ' active' : '');
    card.innerHTML = `
      <div class="song-cover">${song.cover}</div>
      <div class="song-info">
        <h3>${song.title}</h3>
        <p>${song.artist}</p>
      </div>
    `;
    card.onclick = () => playSong(realIndex);
    list.appendChild(card);
  });
}

/* ============ پلیر ============ */
function playSong(index) {
  currentIndex = index;
  loadSong();
  audio.play();
  playBtn.textContent = '⏸';
  updateActiveCard();
}

function loadSong() {
  const song = songsData[currentIndex];
  audio.src = song.src;
  document.getElementById('playerTitle').textContent = song.title;
  document.getElementById('playerArtist').textContent = song.artist;
  document.getElementById('playerCover').textContent = song.cover;
}

function togglePlay() {
  if (!audio.src) { playSong(0); return; }
  if (audio.paused) { audio.play(); playBtn.textContent = '⏸'; }
  else { audio.pause(); playBtn.textContent = '▶'; }
}

function nextSong() {
  if (isShuffle) {
    currentIndex = Math.floor(Math.random() * songsData.length);
  } else {
    currentIndex = (currentIndex + 1) % songsData.length;
  }
  playSong(currentIndex);
}

function prevSong() {
  currentIndex = (currentIndex - 1 + songsData.length) % songsData.length;
  playSong(currentIndex);
}

function toggleShuffle() {
  isShuffle = !isShuffle;
  document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
}

function toggleRepeat() {
  isRepeat = !isRepeat;
  document.getElementById('repeatBtn').classList.toggle('active', isRepeat);
}

function updateActiveCard() {
  document.querySelectorAll('.song-card').forEach((card, i) => {
    card.classList.toggle('active', i === currentIndex);
  });
}

/* ============ رویدادهای پلیر ============ */
audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    progressBar.value = (audio.currentTime / audio.duration) * 100;
    currentTimeEl.textContent = formatTime(audio.currentTime);
  }
});

audio.addEventListener('loadedmetadata', () => {
  totalTimeEl.textContent = formatTime(audio.duration);
});

audio.addEventListener('ended', () => {
  if (isRepeat) {
    audio.play();
  } else {
    nextSong();
  }
});

progressBar.addEventListener('input', () => {
  if (audio.duration) {
    audio.currentTime = (progressBar.value / 100) * audio.duration;
  }
});

volumeBar.addEventListener('input', () => {
  audio.volume = volumeBar.value / 100;
});
audio.volume = 0.7;

function formatTime(sec) {
  if (isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}
